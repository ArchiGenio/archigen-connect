name: Bug report
description: Report a problem with ArchiGen Connect Beta
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Beta. Do not upload passwords, tokens, API keys, project-confidential information, or private company files.
  - type: input
    id: connect-version
    attributes:
      label: ArchiGen Connect version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
    validations:
      required: true
  - type: input
    id: rhino-version
    attributes:
      label: Rhino version
      placeholder: Rhino 8.x
    validations:
      required: true
  - type: input
    id: revit-version
    attributes:
      label: Revit version, if relevant
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable sequence of steps.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshot or log attachment
      description: Remove secrets and confidential project information before attaching files.
